server {
    listen 8080;
    server_name _;

    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # style-src needs 'unsafe-inline': the UI is styled entirely through React inline
    # `style` props (App.tsx, Die.tsx, Scorecard.tsx, theme.ts), so a strict policy
    # would strip the whole design. Inline styles are a far smaller risk than inline
    # scripts, which this policy still blocks. The app makes no network requests, loads
    # no third-party resources and uses system fonts, so everything else stays 'none'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
