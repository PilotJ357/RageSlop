name: Five-Of-A-Kind image

on:
  push:
    branches: [main]
    # Without this, `type=semver` below never matches and a `v1.2.3` tag builds nothing.
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

# Two pushes in quick succession would otherwise race for the `latest` tag, and a
# slow earlier run finishing last would leave `latest` pointing at the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: ghcr.io
  # Named for the app, not the repo: RageSlop is a monorepo, and this workflow builds
  # only Five-Of-A-Kind. github.repository would give `rageslop`, which collides the
  # moment a second project here needs an image.
  IMAGE_NAME: ${{ github.repository_owner }}/five-of-a-kind

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: Five-Of-A-Kind

    steps:
      # Actions are pinned to commit SHAs rather than tags. A tag is mutable: anyone
      # who compromises the action's repo can repoint `v7` at code that then runs here
      # with this job's token. Dependabot (.github/dependabot.yml) keeps the pins fresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token behind in .git/config in the workspace.
          persist-credentials: false

      # Only authenticate when the build will actually publish. On a pull_request run
      # this job compiles code that came from the PR, and there is no reason for
      # registry credentials to be sitting in ~/.docker/config.json while that happens.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          # Deterministic, unlike github.actor, which is the PR author on PR events.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: Five-Of-A-Kind
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
